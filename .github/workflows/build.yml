# Comprueba cada día si faltan versiones de PHP por plataforma, las compila y las
# publica. Compilar ejecuta código de terceros, así que ese job solo puede leer.
# Solo el job de publicar puede escribir, y solo recibe binarios que han pasado
# las pruebas.
name: build

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      versions:
        description: "Versiones exactas separadas por espacios, p. ej. 8.4.27 8.5.12. Vacío: las soportadas."
        required: false
        default: ""
      platforms:
        description: "Plataformas separadas por espacios. Vacío: todas."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: false

env:
  # Rama más antigua que se compila automáticamente.
  MINIMUM_MINOR: "8.3"
  # Combinaciones rama:plataforma que no compilan con static-php-cli 2.8.5 y se
  # omiten en la tarea diaria, para que no falle cada día. Se pueden pedir a mano.
  # 8.3 en Windows falla al enlazar php.exe con el PHP SDK (nmake_cli_wrapper.bat).
  SKIP: "8.3:windows-x64"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED: ${{ inputs.versions }}
          REQUESTED_PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail

          declare -A runners=(
            [macos-arm64]=macos-15
            [linux-x86_64]=ubuntu-24.04
            [linux-arm64]=ubuntu-24.04-arm
            [windows-x64]=windows-2022
          )

          if [ -n "${REQUESTED_PLATFORMS:-}" ]; then
            read -r -a platforms <<<"$REQUESTED_PLATFORMS"
            for platform in "${platforms[@]}"; do
              if [ -z "${runners[$platform]:-}" ]; then
                echo "::error::Plataforma no válida: $platform"
                exit 1
              fi
            done
          else
            platforms=(macos-arm64 linux-x86_64 linux-arm64 windows-x64)
          fi

          if [ -n "${REQUESTED:-}" ]; then
            candidates="$(printf '%s\n' $REQUESTED)"
            if grep -Evq '^[0-9]+\.[0-9]+\.[0-9]+$' <<<"$candidates"; then
              echo "::error::Versiones no válidas: $REQUESTED"
              exit 1
            fi
          else
            candidates="$(curl -fsSL https://www.php.net/releases/active.php |
              jq -r '[.[] | to_entries[] | .value.version] | .[]')"
          fi

          assets="$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[].assets[].name')"
          entries=()
          while IFS= read -r version; do
            minor="${version%.*}"
            oldest="$(printf '%s\n%s\n' "$minor" "$MINIMUM_MINOR" | sort -V | head -n 1)"
            if [ -z "${REQUESTED:-}" ] && [ "$oldest" != "$MINIMUM_MINOR" ]; then
              continue
            fi
            for platform in "${platforms[@]}"; do
              if [ -z "${REQUESTED:-}" ] && [[ " $SKIP " == *" $minor:$platform "* ]]; then
                continue
              fi
              if ! grep -Eq "^php-${version//./\\.}-$platform\.(tar\.gz|zip)$" <<<"$assets"; then
                entries+=("$(jq -cn --arg php "$version" --arg platform "$platform" --arg runner "${runners[$platform]}" \
                  '{php: $php, platform: $platform, runner: $runner}')")
              fi
            done
          done <<<"$candidates"

          echo "Por compilar: ${#entries[@]}"
          printf '%s\n' "${entries[@]:-}"
          if [ "${#entries[@]}" -eq 0 ]; then
            echo "has_work=false" >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
          else
            echo "has_work=true" >> "$GITHUB_OUTPUT"
            echo "matrix=$(printf '%s\n' "${entries[@]}" | jq -cs '{include: .}')" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.has_work == 'true'
    name: build (${{ matrix.php }}, ${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PHP_VERSION: ${{ matrix.php }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar herramientas (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: brew install autoconf automake bison cmake libtool pkgconf re2c

      - name: Compilar (macOS)
        if: startsWith(matrix.platform, 'macos')
        env:
          BUILD_XDEBUG: "1"
          # spc lo usa para no agotar el límite de la API de GitHub.
          GITHUB_TOKEN: ${{ github.token }}
        run: ./build.sh "$PHP_VERSION"

      - name: Compilar (Linux)
        if: startsWith(matrix.platform, 'linux')
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./build-linux.sh "$PHP_VERSION"

      - name: Compilar (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./build-windows.ps1 -Version $env:PHP_VERSION

      - name: Probar (macOS y Linux)
        if: ${{ !startsWith(matrix.platform, 'windows') }}
        run: ./smoke-test.sh "dist/$PHP_VERSION" "$PHP_VERSION"

      - name: Probar (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          & "dist\$env:PHP_VERSION\php.exe" -n smoke-test.php $env:PHP_VERSION windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Empaquetar
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          name="php-$PHP_VERSION-$PLATFORM"
          case "$PLATFORM" in
            windows-*)
              package="$name.zip"
              (cd "dist/$PHP_VERSION" && 7z a -tzip "../../release/$package" . >/dev/null)
              ;;
            *)
              package="$name.tar.gz"
              tar -czf "release/$package" -C "dist/$PHP_VERSION" .
              ;;
          esac
          cd release
          if command -v sha256sum >/dev/null; then
            sha256sum "$package" > "$package.sha256"
          else
            shasum -a 256 "$package" > "$package.sha256"
          fi
          cat "$package.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php-${{ matrix.php }}-${{ matrix.platform }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, build]
    # Se ejecuta aunque falle otra plataforma; las que no compilaron no tienen artefacto.
    if: ${{ !cancelled() && needs.plan.outputs.has_work == 'true' }}
    name: publish (${{ matrix.php }}, ${{ matrix.platform }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      # Varias plataformas comparten release: de una en una para no chocar al crearla.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - id: artifact
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: php-${{ matrix.php }}-${{ matrix.platform }}
          path: release

      - if: steps.artifact.outcome == 'success'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.tar.gz
            release/*.zip

      - name: Publicar en la release
        if: steps.artifact.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PHP_VERSION: ${{ matrix.php }}
        run: |
          set -euo pipefail
          tag="php-$PHP_VERSION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            {
              echo "PHP $PHP_VERSION estático, compilado con static-php-cli."
              echo
              echo "Comprobar el origen de un paquete:"
              echo
              echo '```sh'
              echo "gh attestation verify <paquete> --repo $GH_REPO"
              echo '```'
            } > notes.md
            gh release create "$tag" --title "PHP $PHP_VERSION" --notes-file notes.md
          fi
          gh release upload "$tag" release/*

  # Índice de versiones para los clientes (Elephant Stack). Tiene la forma de la
  # API de releases, pero se descarga como archivo de la release `catalog`, que
  # no cuenta para el límite de la API anónima de GitHub (60 consultas por hora
  # y por IP). Se regenera en cada ejecución, haya compilado algo o no.
  index:
    needs: [plan, publish]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publicar index.json
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.tag_name | startswith("php-")) | {tag_name, draft, prerelease, assets: [.assets[] | {name, browser_download_url, size}]}' |
            jq -s 'sort_by(.tag_name) | reverse' > index.json
          echo "Versiones en el índice: $(jq length index.json)"
          if ! gh release view catalog >/dev/null 2>&1; then
            gh release create catalog --prerelease --title "Índice de versiones" \
              --notes "index.json con todas las versiones publicadas. Se regenera en cada ejecución del workflow."
          fi
          gh release upload catalog index.json --clobber
